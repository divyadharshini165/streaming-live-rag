services:
  streaming-rag:
    build: .
    image: streaming-live-rag:latest
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-hybrid}
      - CORPUS_DIR=/app/data/corpus
    volumes:
      - ./data/corpus:/app/data/corpus:ro     # swap the corpus without rebuilding
      - ./eval/results:/app/eval/results      # benchmark report lands on the host
